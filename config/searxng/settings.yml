use_default_settings: true
general:
  debug: false
  instance_name: "LunaGPT Search"
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "lunagpt_searxng_super_secret_key_random_string_2026"
  limiter: false

engines:
  - name: duckduckgo
    engine: duckduckgo
    disabled: true
  - name: brave
    engine: brave
    disabled: true
  - name: google
    engine: google
    disabled: false
  - name: wikipedia
    engine: wikipedia
    disabled: false
  - name: wikidata
    engine: wikidata
    disabled: false
  - name: github
    engine: github
    disabled: false
  - name: stackoverflow
    engine: stackoverflow
    disabled: false
