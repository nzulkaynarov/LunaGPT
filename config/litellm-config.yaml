# ==============================================================================
# LunaGPT — LiteLLM Gateway & Intelligent Agent Router
# Документация: https://docs.litellm.ai/docs/proxy/config_settings
# ==============================================================================

model_list:
  # ----------------------------------------------------------------------------
  # 1. Локальные модели на AMD RX 580 (Ollama, $0 cost, 34 tok/s)
  # ----------------------------------------------------------------------------
  - model_name: luna-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: os.environ/OLLAMA_API_BASE
      num_ctx: 8192
    model_info:
      description: "Локальная модель для автокомплита и кода на GPU RX 580 (бесплатно, офлайн)"
      mode: chat
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: luna-local
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: os.environ/OLLAMA_API_BASE
      num_ctx: 8192
      think: false
      keep_alive: 30m
    model_info:
      description: "Основная модель общего назначения на своей RX 580 (бесплатно)"
      mode: chat
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: luna-embed
    litellm_params:
      model: ollama/bge-m3:latest
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      description: "Мультиязычные локальные эмбеддинги для RAG и поиска по коду"
      mode: embedding
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # ----------------------------------------------------------------------------
  # 2. Быстрые облачные модели (Google Gemini 3.5 Flash Lite)
  # ----------------------------------------------------------------------------
  - model_name: luna-fast
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Сверхбыстрая облачная модель для длинных документов, переводов и суммаризации"
      mode: chat
      input_cost_per_token: 0.000000300
      output_cost_per_token: 0.000002500

  # Голос Luna (Gemini TTS): владелец выбрал его вместо локального Piper 13.11.2026.
  - model_name: luna-voice
    litellm_params:
      model: gemini/gemini-3.8-flash-tts
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Голос Luna: озвучка ответов"
      mode: audio_speech

  - model_name: luna-voice-lite
    litellm_params:
      model: gemini/gemini-3.8-flash-lite-tts
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Запасной голос Luna, если основной недоступен"
      mode: audio_speech

  # ----------------------------------------------------------------------------
  # 3. Интеллектуальные архитектурные модели (Anthropic Claude Sonnet 5.5 и Opus 5.5)
  # ----------------------------------------------------------------------------
  - model_name: luna-smart
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      # Sonnet 5.5 thinks before almost every reply from "medium" up; "low" keeps a chat answer quick
      # (3.3 s against 5.2 s on the same question) and a request can still ask for more.
      reasoning_effort: low
    model_info:
      description: "Claude Sonnet 5.5: разговор со взрослыми, аналитика, код и логика"
      mode: chat
      input_cost_per_token: 0.000002000
      output_cost_per_token: 0.000010000

  - model_name: luna-pro
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Claude Opus 5.5: самые сложные задачи и комплексный аудит"
      mode: chat
      input_cost_per_token: 0.000004000
      output_cost_per_token: 0.000020000

  # ----------------------------------------------------------------------------
  # 5. HomeSec: платная поддержка, когда luna-fast не справилась (HomeSec сам решает, когда переходить)
  # ----------------------------------------------------------------------------
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "HomeSec support: Claude Sonnet 4.6 when luna-fast could not answer"
      mode: chat
      input_cost_per_token: 0.000003000
      output_cost_per_token: 0.000015000
      cache_read_input_token_cost: 0.000000300
      cache_creation_input_token_cost: 0.000003750

router_settings:
  # Luna chooses its own order of models per feature (assistant/llm.py), so luna-* groups have no
  # gateway fallbacks: a text-only coder model answering a tool or audio request invents results.
  # HomeSec climbs its own ladder too (luna-fast, then claude-sonnet-4-6), so no group has fallbacks here.
  allowed_fails: 2
  cooldown_time: 30

# ==============================================================================
# 5. Наблюдаемость и тайм-ауты
# ==============================================================================
litellm_settings:
  drop_params: true
  # No request may hang longer than this; Luna's own client gives up after 90 s.
  request_timeout: 120
  set_verbose: false
  callbacks: ["config.langfuse_v2_logger.langfuse_v2_logger"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
