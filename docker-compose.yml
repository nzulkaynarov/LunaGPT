services:
  # ============================================================================
  # 1. LunaGPT Gateway (LiteLLM Proxy & Router)
  # Единая точка входа для WebUI, VS Code, Antigravity, Aider и CLI-агентов
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: lunagpt-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
      - ./config/langfuse_v2_logger.py:/app/config/langfuse_v2_logger.py:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@langfuse-db:5432/litellm
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-server:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:?set LANGFUSE_PUBLIC_KEY in .env}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:?set LANGFUSE_SECRET_KEY in .env}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # One worker: a family's traffic is hundreds of calls a day, four workers took 3.2 GiB and kept
    # separate per-key rate limits.
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    mem_limit: 1536m
    oom_score_adj: -500
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - langfuse-server

  # ============================================================================
  # 3. LunaGPT Web UI (Open WebUI)
  # ============================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: lunagpt-webui
    restart: unless-stopped
    # Unused since 2026-11-08; starts only with `docker compose --profile webui up`.
    profiles: ["webui"]
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    environment:
      - OPENAI_API_BASE_URL=http://core:8010/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_OLLAMA_API=False
      - WEBUI_NAME=LunaGPT
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@langfuse-db:5432/openwebui
      - ENABLE_FORWARD_USER_INFO_HEADERS=True
      - FORWARD_USER_INFO_HEADERS=True
      - FORWARD_SESSION_INFO_HEADERS=True
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://core:8010/v1
      - RAG_OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - RAG_EMBEDDING_MODEL=luna-embed
      - CONTENT_EXTRACTION_ENGINE=external
      - EXTERNAL_DOCUMENT_LOADER_URL=http://core:8010
      - EXTERNAL_DOCUMENT_LOADER_API_KEY=${LITELLM_MASTER_KEY}
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://postgres:${POSTGRES_PASSWORD}@langfuse-db:5432/openwebui
      - PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH=1024
      - BYPASS_MODEL_ACCESS_CONTROL=True
      - BYPASS_RETRIEVAL_ACCESS_CONTROL=True
      - DEFAULT_USER_ROLE=user
      - DEFAULT_MODELS=luna-smart
      - TASK_MODEL=luna-fast
      - TASK_MODEL_EXTERNAL=luna-fast
      - AUDIO_STT_ENGINE=web
      - AUDIO_TTS_ENGINE=
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core

  # ============================================================================
  # 4. Langfuse Server (LLM Observability, Metrics & Tracing)
  # ============================================================================
  langfuse-server:
    image: ghcr.io/langfuse/langfuse:2
    container_name: lunagpt-langfuse
    mem_limit: 768m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@langfuse-db:5432/langfuse}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - AUTH_TRUST_HOST=true
      - TELEMETRY_ENABLED=false
      - LANGFUSE_INIT_ORG_ID=lunagpt-org
      - LANGFUSE_INIT_ORG_NAME=LunaGPT
      - LANGFUSE_INIT_PROJECT_ID=lunagpt
      - LANGFUSE_INIT_PROJECT_NAME=LunaGPT
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:?set LANGFUSE_PUBLIC_KEY in .env}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:?set LANGFUSE_SECRET_KEY in .env}
      - LANGFUSE_INIT_USER_EMAIL=admin@lunagpt.local
      - LANGFUSE_INIT_USER_NAME=Administrator
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_ADMIN_PASSWORD}
    depends_on:
      langfuse-db:
        condition: service_healthy

  # ============================================================================
  # 5. PostgreSQL 17 + pgvector (Langfuse + Векторная память LunaGPT)
  # ============================================================================
  langfuse-db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: lunagpt-postgres
    mem_limit: 1g
    oom_score_adj: -500
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-langfuse}
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langfuse}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 6. SearXNG (Приватный метапоисковик для автономного веб-поиска LunaGPT)
  # ============================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: lunagpt-searxng
    mem_limit: 256m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8082/

  # ============================================================================
  # 7. LunaGPT Core Service (FastAPI Active Learning, Memory & RAG)
  # ============================================================================
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: lunagpt-core:local
    container_name: lunagpt-core
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
    command: ["sh", "-c", "alembic upgrade head && python3 -m uvicorn lunagpt.api:app --host 0.0.0.0 --port 8010"]
    environment:
      - CORE_API_KEY=${CORE_API_KEY:-}
      - LITELLM_ENDPOINT=http://litellm:4000/v1/chat/completions
      - LITELLM_EMBEDDINGS_ENDPOINT=http://litellm:4000/v1/embeddings
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LUNAGPT_DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@langfuse-db:5432/lunagpt
      - OPENWEBUI_DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@langfuse-db:5432/openwebui
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-server:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:?set LANGFUSE_PUBLIC_KEY in .env}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:?set LANGFUSE_SECRET_KEY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      langfuse-db:
        condition: service_healthy
      litellm:
        condition: service_started

  # ============================================================================
  # 8. Luna AI Assistant (Telegram assistant for the family)
  # ============================================================================
  luna-assistant:
    image: lunagpt-core:local
    container_name: luna-assistant
    mem_limit: 768m
    oom_score_adj: -500
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
    command: ["python3", "-m", "lunagpt.assistant"]
    healthcheck:
      disable: true
    environment:
      - LITELLM_ENDPOINT=http://litellm:4000/v1/chat/completions
      - LITELLM_EMBEDDINGS_ENDPOINT=http://litellm:4000/v1/embeddings
      - LITELLM_ASSISTANT_KEY=${LITELLM_ASSISTANT_KEY}
      - LUNA_TELEGRAM_BOT_TOKEN=${LUNA_TELEGRAM_BOT_TOKEN}
      - LUNA_PI_API_TOKEN=${LUNA_PI_API_TOKEN}
      - LUNA_GOOGLE_SERVICE_ACCOUNT=${LUNA_GOOGLE_SERVICE_ACCOUNT:-}
      - LUNAGPT_DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@langfuse-db:5432/lunagpt
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      langfuse-db:
        condition: service_healthy
      core:
        condition: service_started

volumes:
  open-webui-data:
    name: lunagpt_open_webui_data
  langfuse-db-data:
    name: lunagpt_langfuse_data
